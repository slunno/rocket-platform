name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rocket:rocket-ci-password@localhost:5432/rocket?schema=public
      JWT_SECRET: ci-secret-with-at-least-32-characters
      DEMO_AUTH_ENABLED: 'true'
      AUTH_INTEGRATION_TESTS: 'true'
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: rocket-minio
      STORAGE_SECRET_KEY: rocket-minio-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rocket
          POSTGRES_PASSWORD: rocket-ci-password
          POSTGRES_DB: rocket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rocket -d rocket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate:deploy
      - name: Start MinIO
        run: |
          docker run -d --name rocket-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rocket-minio \
            -e MINIO_ROOT_PASSWORD=rocket-minio-secret \
            bitnamilegacy/minio:2025.7.23 \
            server /data --console-address ":9001"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs rocket-minio
          exit 1
      - run: npm run test
      - run: npm run build
      - run: npm run db:seed
      - name: Smoke test local app
        run: |
          npm run dev > /tmp/rocket-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4000/api/health > /tmp/rocket-health.json && curl --silent --fail http://localhost:5173/ > /tmp/rocket-web.html; then
              break
            fi
            sleep 2
          done
          cat /tmp/rocket-dev.log
          grep -q '"status":"ok","database":"connected"' /tmp/rocket-health.json
          grep -qi 'Rocket' /tmp/rocket-web.html
      - if: always()
        run: docker rm -f rocket-minio >/dev/null 2>&1 || true
